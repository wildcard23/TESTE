<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campeonato de Futsal</title>
  <style>
    :root {
      --verde-escuro: #0c5f38;
      --verde: #1c8c52;
      --verde-claro: #dff7e8;
      --cinza: #f3f5f7;
      --texto: #1f2d2a;
      --amarelo: #f7c948;
      --vermelho: #d94b4b;
      --branco: #ffffff;
      --sombra: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eafaf1, #d6f3de 40%, #cde9d1);
      color: var(--texto);
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
    }

    .header {
      background: linear-gradient(90deg, var(--verde-escuro), var(--verde));
      color: var(--branco);
      border-radius: 20px;
      padding: 24px 28px;
      box-shadow: var(--sombra);
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 3vw, 3rem);
    }

    .header p {
      margin: 0;
      font-size: 1rem;
      opacity: 0.9;
    }

    .top-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--sombra);
      text-align: center;
    }

    .card span {
      display: block;
      font-size: 0.85rem;
      color: #4a5b56;
      margin-bottom: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card strong {
      font-size: 2rem;
      color: var(--verde-escuro);
    }

    .main {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 24px;
    }

    .panel {
      background: rgba(255,255,255,0.94);
      border-radius: 18px;
      box-shadow: var(--sombra);
      padding: 20px;
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: var(--verde-escuro);
      font-size: 1.4rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }

    th, td {
      text-align: center;
      padding: 12px 10px;
      border-bottom: 1px solid #e6ebee;
    }

    th {
      background: #edf6f0;
      color: var(--verde-escuro);
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: #f7faf8;
    }

    .badge {
      display: inline-block;
      min-width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--verde-claro);
      color: var(--verde-escuro);
      font-weight: bold;
      line-height: 28px;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .primary {
      background: var(--verde);
      color: var(--branco);
    }

    .secondary {
      background: #e9f3ec;
      color: var(--verde-escuro);
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .result-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-list li {
      background: #f7faf8;
      padding: 12px 14px;
      border-radius: 12px;
      border-left: 5px solid var(--verde);
      font-size: 0.97rem;
    }

    .result-list strong {
      color: var(--verde-escuro);
    }

    @media (max-width: 850px) {
      .main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Campeonato de Futsal Intercurso</h1>
      <p>Simulação da competição entre os times do curso.</p>
    </header>

    <section class="top-cards">
      <div class="card">
        <span>Rodada</span>
        <strong id="rodadaAtual">1</strong>
      </div>
      <div class="card">
        <span>Times</span>
        <strong id="quantidadeTimes">6</strong>
      </div>
      <div class="card">
        <span>Partidas</span>
        <strong id="partidasJogadas">0</strong>
      </div>
      <div class="card">
        <span>Líder</span>
        <strong id="liderAtual">-</strong>
      </div>
    </section>

    <main class="main">
      <section class="panel">
        <h2>Tabela do Campeonato</h2>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Time</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GP</th>
              <th>GC</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody id="tabelaTimes"></tbody>
        </table>

        <div class="controls">
          <button class="primary" id="jogarRodada">Jogar Rodada</button>
          <button class="secondary" id="reiniciar">Reiniciar</button>
        </div>
      </section>

      <aside class="panel">
        <h2>Últimos Resultados</h2>
        <ul class="result-list" id="resultados"></ul>
      </aside>
    </main>
  </div>

  <script>
    const times = [
      { nome: 'Tigres', pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gp: 0, gc: 0 },
      { nome: 'Leões', pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gp: 0, gc: 0 },
      { nome: 'Dragões', pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gp: 0, gc: 0 },
      { nome: 'Vikings', pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gp: 0, gc: 0 },
      { nome: 'Falcões', pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gp: 0, gc: 0 },
      { nome: 'Cães do Campo', pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gp: 0, gc: 0 }
    ];

    let rodada = 1;
    let partidasJogadas = 0;
    let resultados = [];

    function ordenarTabela() {
      return [...times].sort((a, b) => {
        if (b.pontos !== a.pontos) return b.pontos - a.pontos;
        const saldoA = a.gp - a.gc;
        const saldoB = b.gp - b.gc;
        if (saldoB !== saldoA) return saldoB - saldoA;
        return b.gp - a.gp;
      });
    }

    function atualizarResumo() {
      const lider = ordenarTabela()[0];
      document.getElementById('rodadaAtual').textContent = rodada;
      document.getElementById('quantidadeTimes').textContent = times.length;
      document.getElementById('partidasJogadas').textContent = partidasJogadas;
      document.getElementById('liderAtual').textContent = lider ? lider.nome : '-';
    }

    function renderTabela() {
      const tabela = ordenarTabela();
      const tbody = document.getElementById('tabelaTimes');
      tbody.innerHTML = '';

      tabela.forEach((time, index) => {
        const tr = document.createElement('tr');
        const saldo = time.gp - time.gc;

        tr.innerHTML = `
          <td><span class="badge">${index + 1}</span></td>
          <td>${time.nome}</td>
          <td>${time.pontos}</td>
          <td>${time.jogos}</td>
          <td>${time.vitorias}</td>
          <td>${time.empates}</td>
          <td>${time.derrotas}</td>
          <td>${time.gp}</td>
          <td>${time.gc}</td>
          <td>${saldo}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    function renderResultados() {
      const lista = document.getElementById('resultados');
      lista.innerHTML = '';

      if (resultados.length === 0) {
        const item = document.createElement('li');
        item.textContent = 'Nenhuma partida jogada ainda.';
        lista.appendChild(item);
        return;
      }

      resultados.slice(0, 6).forEach((res) => {
        const item = document.createElement('li');
        item.innerHTML = `<strong>${res.timeA}</strong> ${res.golsA} x ${res.golsB} <strong>${res.timeB}</strong>`;
        lista.appendChild(item);
      });
    }

    function simularPartida(timeA, timeB) {
      const golsA = Math.floor(Math.random() * 5);
      const golsB = Math.floor(Math.random() * 5);

      timeA.jogos += 1;
      timeB.jogos += 1;
      timeA.gp += golsA;
      timeB.gp += golsB;
      timeA.gc += golsB;
      timeB.gc += golsA;

      if (golsA > golsB) {
        timeA.pontos += 3;
        timeA.vitorias += 1;
        timeB.derrotas += 1;
      } else if (golsB > golsA) {
        timeB.pontos += 3;
        timeB.vitorias += 1;
        timeA.derrotas += 1;
      } else {
        timeA.pontos += 1;
        timeB.pontos += 1;
        timeA.empates += 1;
        timeB.empates += 1;
      }

      resultados.unshift({ timeA: timeA.nome, timeB: timeB.nome, golsA, golsB });
      partidasJogadas += 1;
    }

    function jogarRodada() {
      const timesEmJogo = [...times].sort(() => Math.random() - 0.5);

      // evita partidas repetidas em uma mesma rodada
      for (let i = 0; i < timesEmJogo.length; i += 2) {
        if (timesEmJogo[i + 1]) {
          simularPartida(timesEmJogo[i], timesEmJogo[i + 1]);
        }
      }

      rodada += 1;
      atualizarResumo();
      renderTabela();
      renderResultados();
    }

    function reiniciarCampeonato() {
      times.forEach((time) => {
        time.pontos = 0;
        time.jogos = 0;
        time.vitorias = 0;
        time.empates = 0;
        time.derrotas = 0;
        time.gp = 0;
        time.gc = 0;
      });

      rodada = 1;
      partidasJogadas = 0;
      resultados = [];

      atualizarResumo();
      renderTabela();
      renderResultados();
    }

    document.getElementById('jogarRodada').addEventListener('click', jogarRodada);
    document.getElementById('reiniciar').addEventListener('click', reiniciarCampeonato);

    atualizarResumo();
    renderTabela();
    renderResultados();
  </script>
</body>
</html>
